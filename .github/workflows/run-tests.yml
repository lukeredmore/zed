name: Run Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 0
  MACOSX_DEPLOYMENT_TARGET: "10.15.7"

jobs:
  # Tier 1: Lightweight pure-Rust sanity checks (~299 transitive crates; no GPUI, Wasmtime, Protobuf, or WASI SDK).
  # Gives fast feedback in ~1-2 minutes even on a cold cache.
  fast-sanity:
    name: Fast Sanity (Extension API, Release Channel & Mermaid)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "fast-sanity"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check zed_extension_api & run fast unit tests
        run: |
          cargo check -p zed_extension_api --all-targets
          cargo nextest run \
            -p release_channel \
            -p mermaid_render \
            --no-fail-fast \
            --no-tests=warn

  # Tier 2A: Extension Manifest/Builder, WASI Preview 2 Extension Host & GitHub Auto-Updater.
  # Uses `-p` rather than `--workspace` so Cargo never compiles unrelated crates (`zed`, `collab`, `agent`, `editor`).
  test-extension-and-updater:
    name: Extension Host & Auto-Update Tests
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install cmake protobuf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ext-and-updater"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download WASI SDK
        run: |
          ./script/download-wasi-sdk

      - name: Run extension, extension_host & auto_update tests
        run: |
          cargo nextest run \
            -p extension \
            -p auto_update \
            -p extension_host \
            --no-fail-fast \
            --no-tests=warn

  # Tier 2B: WYSIWYG Markdown Canvas, LaTeX Math, Mermaid & Markdown Preview tests.
  # Runs in parallel with Tier 2A without needing WASI SDK or Wasmtime/Cranelift.
  test-markdown:
    name: Markdown & Preview Tests
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install cmake protobuf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "markdown"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run markdown & markdown_preview tests
        run: |
          cargo nextest run \
            -p markdown \
            -p markdown_preview \
            --no-fail-fast \
            --no-tests=warn

  # Tier 3: Any other workspace crates directly modified in the PR (outside the 7 always-tested crates above).
  # Skips compilation completely (finishes in seconds) if no other crates were modified.
  test-changed-crates:
    name: Changed Crates Tests
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect additional changed workspace crates
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          base_ref = os.environ.get("BASE_REF", "") or "main"
          always_tested = {
              "zed_extension_api",
              "release_channel",
              "mermaid_render",
              "extension",
              "auto_update",
              "extension_host",
              "markdown",
              "markdown_preview",
          }

          changed_files = []
          try:
              merge_base = subprocess.check_output(
                  ["git", "merge-base", f"origin/{base_ref}", "HEAD"],
                  text=True,
              ).strip()
              diff_out = subprocess.check_output(
                  ["git", "diff", "--name-only", merge_base, "HEAD"],
                  text=True,
              )
              changed_files = [line.strip() for line in diff_out.splitlines() if line.strip()]
          except Exception as exc:
              print(f"Could not diff against origin/{base_ref}: {exc}")

          metadata_raw = subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              text=True,
          )
          metadata = json.loads(metadata_raw)
          repo_root = pathlib.Path.cwd().resolve()

          dir_to_pkg = {}
          for pkg in metadata.get("packages", []):
              manifest_dir = pathlib.Path(pkg["manifest_path"]).resolve().parent
              try:
                  rel_dir = manifest_dir.relative_to(repo_root).as_posix()
                  dir_to_pkg[rel_dir] = pkg["name"]
              except ValueError:
                  pass

          extra_pkgs = set()
          for f in changed_files:
              for rel_dir, pkg_name in dir_to_pkg.items():
                  if f.startswith(rel_dir + "/") and pkg_name not in always_tested:
                      extra_pkgs.add(pkg_name)

          sorted_pkgs = sorted(extra_pkgs)
          pkg_flags = " ".join(f"-p {p}" for p in sorted_pkgs)
          print(f"Changed files: {changed_files}")
          print(f"Additional changed crates to test: {sorted_pkgs}")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as fh:
                  fh.write(f"has_extra={'true' if sorted_pkgs else 'false'}\n")
                  fh.write(f"pkg_flags={pkg_flags}\n")
          PY

      - name: Install build dependencies
        if: steps.detect.outputs.has_extra == 'true'
        run: |
          brew install cmake protobuf

      - name: Rust cache
        if: steps.detect.outputs.has_extra == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "changed-crates"

      - name: Install cargo-nextest
        if: steps.detect.outputs.has_extra == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download WASI SDK
        if: steps.detect.outputs.has_extra == 'true'
        run: |
          ./script/download-wasi-sdk

      - name: Run tests for additional changed crates
        if: steps.detect.outputs.has_extra == 'true'
        run: |
          cargo nextest run ${{ steps.detect.outputs.pkg_flags }} --no-fail-fast --no-tests=warn
