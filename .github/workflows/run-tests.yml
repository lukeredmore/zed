name: Run Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 0
  MACOSX_DEPLOYMENT_TARGET: "10.15.7"

jobs:
  test-macos:
    name: Run Tests (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install cmake protobuf

      - name: Ensure Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download WASI SDK
        run: |
          ./script/download-wasi-sdk

      - name: Compute nextest package filterset
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          event_name = os.environ.get("EVENT_NAME", "")
          base_ref = os.environ.get("BASE_REF", "") or "main"

          # Always run E2E/sanity suites covering lukeredmore/zed custom functionality:
          # - markdown & markdown_preview: WYSIWYG canvas, LaTeX math, Mermaid, WASI preview bridge
          # - extension_host & extension: v0.8.0 Extension Editor API host & WASI Preview 2 integration
          # - auto_update & release_channel: GitHub release auto-updater & macOS bundle versioning
          sanity_packages = [
              "markdown",
              "markdown_preview",
              "extension_host",
              "extension",
              "auto_update",
              "release_channel",
          ]

          run_all = event_name == "workflow_dispatch"
          changed_files = []

          if not run_all:
              try:
                  merge_base = subprocess.check_output(
                      ["git", "merge-base", f"origin/{base_ref}", "HEAD"],
                      text=True,
                  ).strip()
                  diff_out = subprocess.check_output(
                      ["git", "diff", "--name-only", merge_base, "HEAD"],
                      text=True,
                  )
                  changed_files = [line.strip() for line in diff_out.splitlines() if line.strip()]
              except Exception as exc:
                  print(f"Could not diff against origin/{base_ref} ({exc}); falling back to full workspace.")
                  run_all = True

          root_trigger_prefixes = (
              "Cargo.toml",
              "Cargo.lock",
              "rust-toolchain.toml",
              ".cargo/",
              ".config/nextest.toml",
              ".github/workflows/",
              "script/",
          )
          if any(f == p or f.startswith(p) for f in changed_files for p in root_trigger_prefixes):
              run_all = True

          metadata_raw = subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              text=True,
          )
          metadata = json.loads(metadata_raw)
          repo_root = pathlib.Path.cwd().resolve()

          dir_to_pkg = {}
          workspace_pkg_names = set()
          for pkg in metadata.get("packages", []):
              manifest_dir = pathlib.Path(pkg["manifest_path"]).resolve().parent
              try:
                  rel_dir = manifest_dir.relative_to(repo_root).as_posix()
                  dir_to_pkg[rel_dir] = pkg["name"]
                  workspace_pkg_names.add(pkg["name"])
              except ValueError:
                  pass

          rdeps_packages = set()
          for f in changed_files:
              parts = f.split("/")
              if len(parts) >= 2 and parts[0] in ("crates", "tooling"):
                  candidate_dir = f"{parts[0]}/{parts[1]}"
                  if candidate_dir in dir_to_pkg:
                      rdeps_packages.add(dir_to_pkg[candidate_dir])
                  else:
                      # Handle nested crates such as crates/gpui_Toolkit/... if any
                      for rel_dir, pkg_name in dir_to_pkg.items():
                          if f.startswith(rel_dir + "/"):
                              rdeps_packages.add(pkg_name)

          expr_parts = []
          for pkg in sorted(rdeps_packages):
              expr_parts.append(f"rdeps({pkg})")
          for pkg in sanity_packages:
              if pkg in workspace_pkg_names:
                  expr_parts.append(f"package({pkg})")

          filterset = " | ".join(expr_parts)
          print(f"Changed files ({len(changed_files)}): {changed_files}")
          print(f"Changed packages for rdeps: {sorted(rdeps_packages)}")
          print(f"run_all={run_all}")
          print(f"filterset={filterset}")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as fh:
                  fh.write(f"run_all={'true' if run_all else 'false'}\n")
                  fh.write(f"filterset={filterset}\n")
          PY

      - name: Run tests with cargo-nextest
        run: |
          if [ "${{ steps.filter.outputs.run_all }}" = "true" ]; then
            echo "Running full workspace test suite..."
            cargo nextest run --workspace --no-fail-fast --no-tests=warn
          else
            echo "Running filtered test suite: ${{ steps.filter.outputs.filterset }}"
            cargo nextest run --workspace --no-fail-fast --no-tests=warn -E "${{ steps.filter.outputs.filterset }}"
          fi
